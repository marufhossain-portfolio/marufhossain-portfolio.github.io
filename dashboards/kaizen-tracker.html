<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaizen / CI Tracker — Manufacturing Analytics</title>
  <meta name="description" content="Idea pipeline from submitted to implemented, with savings, waste-type breakdown and a before/after panel." />
  <meta name="theme-color" content="#05060d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/design-system.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <script type="module">
    import { renderShell, el, kpiCards, insights, calcSection, card, fmt, pctStr, color, rag, pill, toolbarButtons, dataTable, downloadCSV, makeRng, addDays, barChart, lineChart, doughnutChart } from "./shared/bundle.js";
    import { DEPARTMENTS, WASTE_TYPES, MONTHS } from "./data/constants.js";

    const shell = renderShell({
      category: "Lean / Industrial Engineering",
      kicker: "Lean / Industrial Engineering",
      title: "Kaizen / CI Tracker",
      description: "Idea pipeline from submitted to implemented, with savings, waste-type breakdown and a before/after panel.",
    });
    const { main, toolbar } = shell;

    document.head.append(el("style", { html: `
      .kanban { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
      .kb-col { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px; min-width:0; }
      .kb-col h4 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; }
      .kb-col h4 .cnt { color:var(--c3); }
      .kb-card { background:var(--bg-2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; transition:.2s; }
      .kb-card:hover { border-color:var(--c3); transform:translateY(-2px); }
      .kb-card.sel { border-color:var(--c3); box-shadow:0 0 0 1px var(--c3); }
      .kb-card .t { font-weight:700; font-size:13.5px; line-height:1.3; }
      .kb-card .m { font-size:12px; color:var(--muted); margin-top:3px; }
      .kb-card .tag { display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); margin-top:7px; }
      .kb-adv { display:inline-block; margin-top:9px; font-size:11px; font-weight:700; color:var(--c3); border:1px solid var(--border); padding:3px 9px; border-radius:8px; }
      .kb-adv:hover { border-color:var(--c3); }
      .ba-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
      .ba-row:last-child { border-bottom:none; }
      .ba-row .lab { color:var(--muted); }
      .ba-row .val { font-weight:700; font-variant-numeric:tabular-nums; }
      @media (max-width:900px){ .kanban { grid-template-columns:1fr 1fr; } }
      @media (max-width:520px){ .kanban { grid-template-columns:1fr; } }
    ` }));

    let seed = 20240801;
    let ideas = [];
    let selectedId = null;
    let view = "kanban";
    const charts = [];
    const STAGES = ["Submitted", "Approved", "In Progress", "Implemented"];
    const OWNERS = ["Rahim Uddin", "Fatema Begum", "Sabbir Ahmed", "Nusrat Jahan", "Tariq Islam", "Sharmin Akter", "Rakib Hasan", "Jannatul Ferdous"];
    const METRICS = [
      { label: "Throughput (units/hr)", lo: 40, hi: 70 },
      { label: "First-pass yield (%)", lo: 80, hi: 92 },
      { label: "Output per operator", lo: 18, hi: 30 },
      { label: "Machine availability (%)", lo: 80, hi: 90 },
      { label: "On-time delivery (%)", lo: 78, hi: 90 },
    ];
    const TITLES = [
      (c, d) => "Reduce " + c.toLowerCase() + " in " + d,
      (c, d) => "Eliminate " + c.toLowerCase() + " at the " + d + " line",
      (c, d) => "Standardize work to cut " + c.toLowerCase(),
      (c, d) => "5S drive for " + d + " " + c.toLowerCase() + " reduction",
      (c, d) => "Poka-yoke against " + c.toLowerCase() + " in " + d,
    ];

    function weightedStage(rng) {
      const r = rng.float(0, 1);
      if (r < 0.3) return "Submitted";
      if (r < 0.55) return "Approved";
      if (r < 0.8) return "In Progress";
      return "Implemented";
    }

    function generate() {
      const rng = makeRng(seed);
      const out = [];
      for (let i = 0; i < 24; i++) {
        const dept = rng.pick(DEPARTMENTS);
        const cat = rng.pick(WASTE_TYPES);
        const metric = rng.pick(METRICS);
        const before = rng.int(metric.lo, metric.hi);
        const after = Math.min(metric.lo >= 70 ? 99 : 999, Math.round(before * (1 + rng.float(0.08, 0.6)) * 10) / 10);
        const estimated = rng.int(60000, 2200000);
        const actual = Math.round(estimated * rng.float(0.55, 1.25));
        const submitDate = addDays(new Date(2024, 0, 1), rng.int(0, 150));
        out.push({
          id: "KZ-" + (1001 + i),
          title: rng.pick(TITLES)(cat, dept),
          owner: rng.pick(OWNERS),
          dept,
          cat,
          estimated,
          actual,
          stage: weightedStage(rng),
          month: submitDate.getMonth(),
          metricLabel: metric.label,
          before,
          after,
        });
      }
      return out;
    }

    function compute() {
      const implemented = ideas.filter((i) => i.stage === "Implemented");
      const totalActual = implemented.reduce((a, i) => a + i.actual, 0);
      const totalEstimated = implemented.reduce((a, i) => a + i.estimated, 0);
      const monthly = Array.from({ length: 6 }, (_, m) => implemented.filter((i) => i.month === m).reduce((a, i) => a + i.actual, 0));
      const cumulative = [];
      let run = 0;
      for (const v of monthly) { run += v; cumulative.push(run); }
      const byDept = DEPARTMENTS.map((d) => ({ dept: d, n: ideas.filter((i) => i.dept === d).length }));
      const byCat = WASTE_TYPES.map((w) => ({ cat: w, n: ideas.filter((i) => i.cat === w).length })).sort((a, b) => b.n - a.n);
      const ownerSaving = OWNERS.map((o) => ({ owner: o, s: implemented.filter((i) => i.owner === o).reduce((a, i) => a + i.actual, 0) })).sort((a, b) => b.s - a.s).slice(0, 6);
      return { implemented: implemented.length, inProgress: ideas.filter((i) => i.stage === "In Progress").length, totalActual, totalEstimated, monthly, cumulative, byDept, byCat, ownerSaving };
    }

    function newChart() {
      const canvas = el("canvas");
      const box = el("div", { class: "chart-box" }, canvas);
      return { box, canvas };
    }
    function add(c) { charts.push(c); return c; }
    function bdt(n) { return "৳" + fmt(n); }

    function stagePill(stage) {
      const map = { "Submitted": "#94a3b8", "Approved": "#fbbf24", "In Progress": "#22d3ee", "Implemented": "#34d399" };
      return el("span", { class: "pill", style: "background:" + map[stage] + "22;color:" + map[stage] }, stage);
    }

    function render() {
      charts.forEach((c) => c.destroy());
      charts.length = 0;
      const c = compute();
      const sel = ideas.find((i) => i.id === selectedId);

      main.innerHTML = "";
      main.append(
        kpiCards([
          { label: "Implemented", value: c.implemented, sub: "ideas shipped", status: "good" },
          { label: "Cumulative savings", value: bdt(c.totalActual), sub: "actual, BDT", status: "good" },
          { label: "In progress", value: c.inProgress, sub: "being worked", status: "warn" },
          { label: "Est. vs actual", value: pctStr(c.totalEstimated ? c.totalActual / c.totalEstimated * 100 : 0, 0), sub: "actual ÷ estimated", status: rag("achievement", c.totalEstimated ? c.totalActual / c.totalEstimated * 100 : 0) },
        ]),
        el("div", { style: "display:flex;gap:8px;margin-bottom:18px" },
          el("button", { type: "button", class: "btn" + (view === "kanban" ? " primary" : ""), onclick: () => { view = "kanban"; render(); } }, "Kanban"),
          el("button", { type: "button", class: "btn" + (view === "table" ? " primary" : ""), onclick: () => { view = "table"; render(); } }, "Table")
        ),
        view === "kanban" ? buildKanban() : buildTable(),
        el("div", { class: "grid cols-2" },
          card("Monthly savings (actual)", "", (() => {
            const { box, canvas } = newChart();
            add(barChart(canvas, { labels: MONTHS.slice(0, 6), datasets: [{ label: "Savings (BDT)", data: c.monthly, color: color(3) }], yTitle: "BDT" }));
            return box;
          })()),
          card("Cumulative savings", "", (() => {
            const { box, canvas } = newChart();
            add(lineChart(canvas, { labels: MONTHS.slice(0, 6), datasets: [{ label: "Cumulative (BDT)", data: c.cumulative, color: color(2) }], yTitle: "BDT", fill: true }));
            return box;
          })())
        ),
        el("div", { class: "grid cols-2" },
          card("Ideas by department", "", (() => {
            const { box, canvas } = newChart();
            add(barChart(canvas, { labels: c.byDept.map((d) => d.dept), datasets: [{ label: "Ideas", data: c.byDept.map((d) => d.n) }], yTitle: "Count" }));
            return box;
          })()),
          card("Ideas by waste type", "", (() => {
            const { box, canvas } = newChart();
            add(doughnutChart(canvas, { labels: c.byCat.map((w) => w.cat), values: c.byCat.map((w) => w.n) }));
            return box;
          })())
        ),
        el("div", { class: "grid cols-2" },
          card("Top contributors by savings", "", (() => {
            const { box, canvas } = newChart();
            add(barChart(canvas, { labels: c.ownerSaving.map((o) => o.owner), datasets: [{ label: "Savings (BDT)", data: c.ownerSaving.map((o) => o.s), color: color(5) }], yTitle: "BDT", horizontal: true }));
            return box;
          })()),
          card("Before / after", "", buildBeforeAfter(sel))
        ),
        insights([
          "<b>" + c.implemented + " of " + ideas.length + "</b> ideas are implemented, delivering <b>" + bdt(c.totalActual) + "</b> in cumulative savings.",
          "Actual vs estimated savings is <b>" + pctStr(c.totalEstimated ? c.totalActual / c.totalEstimated * 100 : 0, 0) + "</b> — " + (c.totalActual >= c.totalEstimated ? "delivering above plan." : "slightly below plan; validate estimates at the Approval gate."),
          "Top waste type is <b>" + (c.byCat[0]?.cat || "—") + "</b> with " + (c.byCat[0]?.n || 0) + " ideas — focus the next kaizen wave there.",
        ]),
        calcSection("How it's calculated", [
          "Saving (BDT) = estimated saving − actual saving (variance shows forecast accuracy)",
          "% gain = (after − before) ÷ before × 100",
          "Cumulative savings = running sum of actual savings of Implemented ideas, by month",
        ], [
          "Savings are estimates provided by idea owners — validate with Finance before reporting.",
          "The 8 wastes (DOWNTIME / TIMWOOD) map to the waste-type breakdown used for idea categorization.",
        ])
      );
    }

    function buildKanban() {
      const cols = STAGES.map((stage) => {
        const items = ideas.filter((i) => i.stage === stage);
        return el("div", { class: "kb-col" },
          el("h4", {}, stage, el("span", { class: "cnt" }, items.length)),
          ...items.map((it) => {
            const card = el("div", { class: "kb-card" + (it.id === selectedId ? " sel" : ""), onclick: () => { selectedId = it.id; render(); } },
              el("div", { class: "t" }, it.title),
              el("div", { class: "m" }, it.owner + " · " + it.dept),
              el("span", { class: "tag" }, it.cat + " · " + bdt(it.estimated)),
              el("div", { class: "m" }, it.metricLabel + ": " + it.before + " → " + it.after)
            );
            if (it.stage !== "Implemented") {
              card.append(el("div", { class: "kb-adv", onclick: (e) => { e.stopPropagation(); advance(it.id); } }, "Advance →"));
            }
            return card;
          })
        );
      });
      return el("div", { class: "kanban" }, ...cols);
    }

    function advance(id) {
      const it = ideas.find((x) => x.id === id);
      if (!it) return;
      const idx = STAGES.indexOf(it.stage);
      if (idx < STAGES.length - 1) it.stage = STAGES[idx + 1];
      render();
    }

    function buildBeforeAfter(sel) {
      if (!sel) {
        return el("div", { style: "color:var(--muted);font-size:13.5px;padding:8px 0" }, "Select a kaizen card or table row to see its before/after metrics.");
      }
      const gain = (sel.after - sel.before) / sel.before * 100;
      return el("div", {},
        el("div", { style: "font-weight:700;margin-bottom:4px" }, sel.title),
        el("div", { style: "font-size:12px;color:var(--muted);margin-bottom:12px" }, sel.owner + " · " + sel.dept + " · " + sel.cat),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, sel.metricLabel + " — before"), el("span", { class: "val" }, sel.before)),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, sel.metricLabel + " — after"), el("span", { class: "val" }, sel.after)),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, "Improvement"), el("span", { class: "val", style: "color:var(--good)" }, "+" + pctStr(gain, 1))),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, "Estimated saving"), el("span", { class: "val" }, bdt(sel.estimated))),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, "Actual saving"), el("span", { class: "val" }, bdt(sel.actual))),
        el("div", { class: "ba-row" }, el("span", { class: "lab" }, "Stage"), el("span", { class: "val" }, stagePill(sel.stage))),
        sel.stage !== "Implemented"
          ? el("button", { class: "btn primary", type: "button", style: "margin-top:14px", onclick: () => advance(sel.id) }, "Advance stage →")
          : null
      );
    }

    function buildTable() {
      return dataTable(
        [
          { label: "Title", key: "title" },
          "Owner",
          "Department",
          "Category",
          { label: "Stage", key: "stage", render: (r) => stagePill(r.stage) },
          { label: "Estimated (BDT)", key: "estimated", align: "right", render: (r) => fmt(r.estimated) },
          { label: "Actual (BDT)", key: "actual", align: "right", render: (r) => fmt(r.actual) },
          { label: "Gain", key: "gain", align: "right", render: (r) => pctStr((r.after - r.before) / r.before * 100, 1) },
        ],
        ideas.map((r) => ({ ...r, gain: (r.after - r.before) / r.before * 100 }))
      );
    }

    function setupToolbar() {
      toolbar.append(
        toolbarButtons({
          onRegenerate: () => { seed = Math.floor(Math.random() * 1e8); ideas = generate(); selectedId = null; render(); },
          onExport: () => {
            downloadCSV("kaizen-tracker", ["ID", "Title", "Owner", "Department", "Category", "Stage", "Estimated (BDT)", "Actual (BDT)", "Metric", "Before", "After", "Gain %"], ideas.map((r) => ({ "ID": r.id, "Title": r.title, "Owner": r.owner, "Department": r.dept, "Category": r.cat, "Stage": r.stage, "Estimated (BDT)": r.estimated, "Actual (BDT)": r.actual, "Metric": r.metricLabel, "Before": r.before, "After": r.after, "Gain %": ((r.after - r.before) / r.before * 100).toFixed(1) })));
          },
        })
      );
    }

    ideas = generate();
    setupToolbar();
    render();
  </script>
</body>
</html>
