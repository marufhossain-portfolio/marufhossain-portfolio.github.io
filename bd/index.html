<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Development Analysis — OPEX Intelligence Suite</title>
<meta name="description" content="Business development analytics — sales pipeline, target vs achievement, lead funnel, revenue trend, win/loss, client/dealer, competitor, forecast and receivable. Demo data." />
<meta name="theme-color" content="#070b14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#070b14; --bg2:#0a101d; --panel:#0e1626; --panel2:#121c2f;
  --line:#1c283a; --text:#e9eefb; --muted:#8ea0bd; --faint:#5f7091;
  --c1:#6366f1; --c2:#a855f7; --c3:#22d3ee; --good:#34d399; --warn:#f59e0b; --bad:#ef4444; --blue:#60a5fa;
  --grad:linear-gradient(120deg,var(--c1),var(--c2) 45%,var(--c3));
}
[data-theme="light"] {
  --bg:#f4f7ff; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef2ff;
  --line:#dbe2f0; --text:#0a0f1f; --muted:#5a6780; --faint:#8b98b5;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden; }
h1,h2,h3,.kpi .v { font-family:'Sora',sans-serif; }
button { font-family:inherit; cursor:pointer; }
select,input { font-family:inherit; }
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-thumb { background:var(--grad); border-radius:9px; border:2px solid var(--bg); }
::-webkit-scrollbar-track { background:transparent; }

.app { display:flex; flex-direction:column; height:100vh; }

/* topbar */
.topbar { flex:none; display:flex; align-items:center; gap:12px; padding:0 18px; height:56px; background:var(--bg2); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:700; font-size:14px; }
.brand-logo { width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center; color:#05060d; font-weight:800; font-size:14px; }
.brand small { display:block; font-size:9px; letter-spacing:.14em; color:var(--muted); font-family:'Manrope'; font-weight:700; }
.top-right { margin-left:auto; display:flex; align-items:center; gap:9px; }
.demo-pill { font-size:11px; font-weight:700; padding:6px 12px; border-radius:9px; color:var(--warn); border:1px solid rgba(245,158,11,.35); background:rgba(245,158,11,.08); }
.icon-btn { width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--text); display:grid; place-items:center; }
.icon-btn .icon-moon { display:none; }
[data-theme="light"] .icon-btn .icon-sun { display:none; }
[data-theme="light"] .icon-btn .icon-moon { display:block; }

/* filters */
.filters { flex:none; display:flex; flex-wrap:wrap; gap:9px; align-items:flex-end; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--bg); }
.fld { display:flex; flex-direction:column; gap:4px; }
.fld label { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
.fld select,.fld input { padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:12.5px; min-width:120px; }
.fld input[type="date"] { min-width:130px; }
.fld select:focus,.fld input:focus { outline:none; border-color:var(--c3); }

/* tabs */
.tabs { flex:none; display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--bg2); }
.tabs .tab { padding:7px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:12.5px; font-weight:600; white-space:nowrap; transition:.15s; }
.tabs .tab:hover { color:var(--text); border-color:var(--c3); }
.tabs .tab.active { background:var(--grad); color:#05060d; border-color:transparent; font-weight:700; }

/* content */
.content { flex:1; overflow-y:auto; padding:22px; }
.dash-head { margin-bottom:18px; }
.dash-head h1 { font-size:22px; font-weight:800; }
.dash-head p { font-size:12.5px; color:var(--muted); margin-top:4px; }

.alerts { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:18px; }
.alert { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; padding:8px 14px; border-radius:10px; color:var(--bad); background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); }
.alert.ok { color:var(--good); background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.3); }

.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:13px; margin-bottom:18px; }
.kpi { background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:14px; padding:14px 16px; position:relative; overflow:hidden; }
.kpi .l { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800; }
.kpi .v { font-size:23px; font-weight:800; margin-top:8px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.kpi .d { font-size:11px; margin-top:5px; font-weight:600; color:var(--muted); }
.kpi .d.up { color:var(--good); }
.kpi .d.down { color:var(--bad); }
.kpi .d.flat { color:var(--muted); }
.kpi .spark { position:absolute; right:0; bottom:0; width:70px; height:30px; opacity:.5; }

.grid { display:grid; gap:13px; margin-bottom:18px; }
.grid-2 { grid-template-columns:1fr 1fr; }
.grid-2-1 { grid-template-columns:2fr 1fr; }
.grid-1-2 { grid-template-columns:1fr 2fr; }

.panel { background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:14px; padding:16px; }
.panel h3 { font-size:13px; font-weight:700; margin-bottom:4px; }
.panel .sub { font-size:11px; color:var(--faint); margin-bottom:14px; }
.panel .chart { position:relative; height:260px; }
.panel .chart.tall { height:330px; }

.tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
.tbl th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line); }
.tbl td { padding:9px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
.tbl tr:last-child td { border-bottom:0; }
.tbl .num { text-align:right; }
.tbl .mono { font-family:ui-monospace,monospace; font-size:11.5px; }
.tbl tr.row-red { background:rgba(239,68,68,.08); }
.tbl tr.row-amber { background:rgba(245,158,11,.08); }
.twrap { overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
.pill { display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:800; }
.pill.g { background:rgba(52,211,153,.14); color:var(--good); }
.pill.y { background:rgba(245,158,11,.14); color:var(--warn); }
.pill.r { background:rgba(239,68,68,.14); color:var(--bad); }
.pill.b { background:rgba(34,211,238,.14); color:var(--c3); }

.insight { margin-top:16px; padding:14px 18px; border-radius:12px; border:1px solid rgba(34,211,238,.35); background:rgba(34,211,238,.06); color:var(--muted); font-size:13.5px; }
.insight b { color:var(--c3); }

.footer { flex:none; padding:12px 20px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); text-align:center; }
.footer b { color:var(--warn); }

@media (max-width:900px) {
  .grid-2,.grid-2-1,.grid-1-2 { grid-template-columns:1fr; }
  .content { padding:14px; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .fld select,.fld input { min-width:0; }
}
@media (prefers-reduced-motion: reduce) { * { animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-logo">B</span>
      <span>Business Development Analysis<small>OPEX INTELLIGENCE SUITE</small></span>
    </div>
    <div class="top-right">
      <span class="demo-pill">DEMO DATA</span>
      <button class="icon-btn" id="exportCsv" title="Export current table as CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="filters">
    <div class="fld"><label>From</label><input type="date" id="fFrom" /></div>
    <div class="fld"><label>To</label><input type="date" id="fTo" /></div>
    <div class="fld"><label>Region</label><select id="fRegion"></select></div>
    <div class="fld"><label>Category</label><select id="fCategory"></select></div>
    <div class="fld"><label>Sales owner</label><select id="fOwner"></select></div>
    <div class="fld"><label>Client type</label><select id="fType"></select></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content" id="content"></div>

  <div class="footer">Data as of <span id="asOf"></span> · <b>Demo data</b> — synthetic, for demonstration only</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>document.getElementById('asOf').textContent = BD.fmt(BD.TODAY);</script>
</body>
</html>
