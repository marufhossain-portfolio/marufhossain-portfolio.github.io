<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPEX Intelligence Suite — 30+ Interactive Dashboards</title>
<meta name="description" content="OPEX Intelligence Suite — 30+ interactive analytics dashboards across manufacturing, sales & distribution and executive BI. All data is synthetic sample data." />
<meta name="theme-color" content="#070b14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#070b14; --bg2:#0b1220; --panel:#0e1628; --panel2:#121c30;
  --border:#1c2840; --text:#eaf0fb; --muted:#8b98b5; --faint:#5b6a88;
  --c1:#6366f1; --c2:#a855f7; --c3:#22d3ee; --c4:#34d399; --warn:#fbbf24;
  --grad:linear-gradient(120deg,var(--c1),var(--c2) 45%,var(--c3));
  --sbw:250px;
}
[data-theme="light"] {
  --bg:#f4f7ff; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef2ff;
  --border:#dbe2f0; --text:#0a0f1f; --muted:#5a6780; --faint:#8b98b5;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:"Manrope",system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; }
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-thumb { background:var(--grad); border-radius:9px; border:2px solid var(--bg); }
::-webkit-scrollbar-track { background:transparent; }

.app { display:flex; height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width:var(--sbw); flex:none; height:100vh; overflow-y:auto;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:40;
}
.brand { display:flex; align-items:center; gap:12px; padding:20px 18px 16px; }
.brand-logo { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--grad); color:#05060d; font-family:"Sora",sans-serif; font-weight:800; font-size:15px; box-shadow:0 0 26px -6px var(--c1); }
.brand-txt { font-family:"Sora",sans-serif; font-weight:700; font-size:15px; line-height:1.15; letter-spacing:-.01em; }
.brand-txt small { display:block; font-family:"Manrope",sans-serif; font-size:9.5px; letter-spacing:1.5px; color:var(--muted); font-weight:600; }

.nav { flex:1; padding:6px 12px 12px; }
.nav-label { padding:14px 8px 7px; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
.nav-item {
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:11px 13px; margin:2px 0; border-radius:11px; border:none; background:transparent;
  color:var(--muted); font-size:13.5px; font-weight:600; transition:.18s;
}
.nav-item:hover { background:var(--panel); color:var(--text); }
.nav-item.active { background:color-mix(in srgb,var(--c1) 18%,transparent); color:var(--text); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 42%,transparent); }
.nav-item .ic { font-size:16px; width:22px; flex:none; }
.nav-item .cnt { margin-left:auto; font-size:10.5px; font-weight:700; color:var(--c3); background:color-mix(in srgb,var(--c3) 14%,transparent); border:1px solid color-mix(in srgb,var(--c3) 35%,transparent); padding:1px 8px; border-radius:999px; }

.side-foot { padding:14px 18px; border-top:1px solid var(--border); }
.live { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); }
.live .dot { width:8px; height:8px; border-radius:50%; background:var(--c4); box-shadow:0 0 0 0 rgba(52,211,153,.7); animation:pulse 1.8s infinite; }
@keyframes pulse { 70%{ box-shadow:0 0 0 9px transparent; } 100%{ box-shadow:0 0 0 0 transparent; } }
.side-credit { font-size:10.5px; color:var(--faint); margin-top:8px; letter-spacing:.03em; }

/* ===== MAIN ===== */
.main { flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; }
.topbar { height:56px; flex:none; display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--bg) 88%,transparent); }
.burger { display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); place-items:center; }
.crumb { font-family:"Sora",sans-serif; font-weight:700; font-size:14.5px; }
.crumb .grp { color:var(--faint); font-weight:600; font-size:13px; }
.top-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.demo-pill { display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.04em; color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); border:1px solid color-mix(in srgb,var(--warn) 40%,transparent); }
.theme-toggle { width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); display:grid; place-items:center; }
.theme-toggle .icon-moon { display:none; }
[data-theme="light"] .theme-toggle .icon-sun { display:none; }
[data-theme="light"] .theme-toggle .icon-moon { display:block; }

/* ===== TAB BAR (wraps, no scroll) ===== */
.tabbar { flex:none; display:flex; flex-wrap:wrap; gap:7px; padding:11px 16px; border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--bg2) 60%,transparent); }
.tab {
  padding:7px 15px; border-radius:9px; border:1px solid var(--border);
  background:var(--panel); color:var(--muted); font-size:12.5px; font-weight:600; white-space:nowrap; transition:.16s;
}
.tab:hover { color:var(--text); border-color:var(--c3); }
.tab.active { background:var(--grad); color:#05060d; border-color:transparent; font-weight:700; }

.content { flex:1; position:relative; overflow:hidden; background:var(--bg); }
#frame { position:absolute; inset:0; width:100%; height:100%; border:0; }

.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35; opacity:0; pointer-events:none; transition:.25s; }

@media (max-width:860px) {
  .sidebar { position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .3s cubic-bezier(.22,1,.36,1); }
  .sidebar.open { transform:translateX(0); }
  .sidebar-overlay.show { opacity:1; pointer-events:auto; }
  .burger { display:grid; }
}
@media (prefers-reduced-motion: reduce) { * { animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div class="brand-txt">OPEX Intelligence<br><small>SUITE · ANALYTICS</small></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <div class="live"><span class="dot"></span>Demo data — sample &amp; synthetic</div>
      <div class="side-credit">Md. Maruf Hossain · Operational Excellence</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="crumb" id="crumb">CEO Overview</div>
      <div class="top-right">
        <span class="demo-pill">SAMPLE DATA</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>
    <div class="tabbar" id="tabbar" style="display:none"></div>
    <div class="content" id="content">
      <iframe id="frame" title="Dashboard"></iframe>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="overlay"></div>

<script>
(function(){
"use strict";
var SINGLES = [
  { id:"ceo", name:"CEO Overview", icon:"💼", url:"/opex-dashboards/#ceo" },
  { id:"bd", name:"Business Development Analysis", icon:"🚀", url:"/bd/" }
];

var SUITES = [
  { id:"manufacturing", name:"Manufacturing Analytics", icon:"🏭", items:[
    { t:"Line Balancing Simulator", u:"/dashboards/line-balancing.html" },
    { t:"Capacity Planning", u:"/dashboards/capacity-planning.html" },
    { t:"Downtime Pareto & Reliability", u:"/dashboards/downtime-reliability.html" },
    { t:"Kaizen / CI Tracker", u:"/dashboards/kaizen-tracker.html" },
    { t:"Value Stream Map", u:"/dashboards/value-stream-map.html" },
    { t:"Time Study Tool", u:"/dashboards/time-study.html" },
    { t:"Production Plan vs Actual", u:"/dashboards/production-plan.html" },
    { t:"Quality & SPC", u:"/dashboards/quality-spc.html" },
    { t:"Inventory & Store", u:"/dashboards/inventory.html" },
    { t:"Maintenance", u:"/dashboards/maintenance.html" },
    { t:"Supplier Performance", u:"/dashboards/supplier.html" },
    { t:"Executive OEE & Loss", u:"/dashboards/executive-oee.html" },
    { t:"Cost & Savings", u:"/dashboards/cost-savings.html" },
    { t:"Productivity & Manpower", u:"/dashboards/productivity-manpower.html" },
    { t:"Energy & Utilities", u:"/dashboards/energy.html" }
  ]},
  { id:"sales", name:"Sales & Distribution", icon:"🚗", items:[
    { t:"Daily Sales MIS", u:"/sales-mis/daily-sales.html" },
    { t:"Target vs Achievement", u:"/sales-mis/target-achievement.html" },
    { t:"Dealer Performance", u:"/sales-mis/dealer-performance.html" },
    { t:"Sales Funnel & Tracking", u:"/sales-mis/sales-funnel.html" },
    { t:"Booking vs Delivery", u:"/sales-mis/booking-delivery.html" },
    { t:"Vehicle Inventory MIS", u:"/sales-mis/vehicle-inventory.html" },
    { t:"Management Dashboard", u:"/sales-mis/management-dashboard.html" },
    { t:"Data Quality & Validation", u:"/sales-mis/data-quality.html" }
  ]},
  { id:"opex", name:"OPEX BI", icon:"📈", items:[
    { t:"Production Dashboard", u:"/opex-dashboards/#production" },
    { t:"Maintenance Analysis", u:"/opex-dashboards/#maintenance" },
    { t:"Delivery Analysis", u:"/opex-dashboards/#delivery" },
    { t:"Production Planning", u:"/opex-dashboards/#planning" },
    { t:"Quality", u:"/opex-dashboards/#quality" },
    { t:"5S Dashboard", u:"/opex-dashboards/#fives" }
  ]}
];

var $ = function(id){ return document.getElementById(id); };
var nav = $("nav"), frame = $("frame"), crumb = $("crumb"), tabbar = $("tabbar");
var current = "ceo";

function renderNav(){
  nav.innerHTML = '<div class="nav-label">Dashboards</div>';
  SINGLES.forEach(function(sn){
    var b = document.createElement("button");
    b.className = "nav-item" + (current === sn.id ? " active" : "");
    b.innerHTML = '<span class="ic">' + sn.icon + '</span>' + sn.name;
    b.addEventListener("click", function(){ openSingle(sn.id); });
    nav.appendChild(b);
  });
  SUITES.forEach(function(s){
    var b = document.createElement("button");
    b.className = "nav-item" + (current === s.id ? " active" : "");
    b.innerHTML = '<span class="ic">' + s.icon + '</span>' + s.name + '<span class="cnt">' + s.items.length + '</span>';
    b.addEventListener("click", function(){ openSuite(s.id); });
    nav.appendChild(b);
  });
}

function openSingle(id){
  var sn = SINGLES.find(function(x){ return x.id === id; });
  if(!sn) return;
  current = id;
  renderNav();
  tabbar.style.display = "none";
  frame.src = sn.url;
  frame.style.display = "block";
  crumb.textContent = sn.name;
  closeSidebar();
}

function openSuite(id){
  var s = SUITES.find(function(x){ return x.id === id; });
  if(!s) return;
  current = id;
  renderNav();
  tabbar.style.display = "flex";
  tabbar.innerHTML = "";
  s.items.forEach(function(it){
    var t = document.createElement("button");
    t.className = "tab";
    t.textContent = it.t;
    t.addEventListener("click", function(){ loadTab(s, it, t); });
    tabbar.appendChild(t);
  });
  loadTab(s, s.items[0], tabbar.querySelector(".tab"));
  closeSidebar();
}

function loadTab(s, it, btn){
  frame.src = it.u;
  frame.style.display = "block";
  crumb.innerHTML = '<span class="grp">' + s.name + ' · </span>' + it.t;
  tabbar.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}

// theme
var root = document.documentElement;
var stored = localStorage.getItem("mmh2-theme");
var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
root.setAttribute("data-theme", stored || (prefersLight ? "light" : "dark"));
$("themeToggle").addEventListener("click", function(){
  var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  localStorage.setItem("mmh2-theme", next);
});

// mobile sidebar
var sidebar = $("sidebar"), overlay = $("overlay");
function closeSidebar(){ sidebar.classList.remove("open"); overlay.classList.remove("show"); }
$("burger").addEventListener("click", function(){ sidebar.classList.add("open"); overlay.classList.add("show"); });
overlay.addEventListener("click", closeSidebar);

document.querySelector(".brand").addEventListener("click", function(){ openSingle("ceo"); });

renderNav();
openSingle("ceo");
})();
</script>
</body>
</html>
